[package]
name = "jotdown-afl"
version = "0.1.0"
edition = "2024"
default-run = "main"

[dependencies]
afl = "0.17"
jotdown = { path = "../../", features = ["html", "deterministic", "log"], default-features = false  }
html5ever = "0.26"
env_logger = "0.11"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "parse"
path = "src/parse.rs"

[[bin]]
name = "html"
path = "src/html.rs"

[features]
default = ["debug"]
debug = []
